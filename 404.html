<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found | Hawaii Pool Cleaners</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/wp-content/uploads/2024/06/cropped-Hawaii-Pool-Cleaners-Logo-192x192.jpg" sizes="192x192">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--teal:#00D082;--navy:#0a1628;--mid:#1a3a5c;--lteal:#7adcb4;--white:#ffffff;--lgray:#f8fafc;--muted:#4a6080}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px}
body{font-family:'Libre Franklin',sans-serif;font-weight:400;line-height:1.65;color:var(--navy);background:var(--white);min-height:100vh;display:flex;flex-direction:column}
.nav{position:fixed;top:0;left:0;right:0;z-index:1000;padding:16px 48px;display:flex;align-items:center;justify-content:space-between;background:rgba(10,22,40,.95);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid rgba(0,208,130,.15)}
.nav-logo{display:flex;align-items:center;gap:12px;text-decoration:none}
.nav-logo img{height:52px;width:52px;object-fit:contain;border-radius:4px}
.nav-logo-text{font-size:1rem;font-weight:700;color:#fff;line-height:1.2;letter-spacing:-.02em}
.nav-logo-text span{display:block;font-size:.62rem;font-weight:400;color:var(--lteal);letter-spacing:.14em;text-transform:uppercase}
.nav-links{display:flex;align-items:center;gap:32px;list-style:none}
.nav-links a{color:rgba(255,255,255,.82);text-decoration:none;font-size:.82rem;font-weight:500;letter-spacing:.06em;text-transform:uppercase;transition:color .3s}
.nav-links a:hover{color:var(--teal)}
.nav-cta{white-space:nowrap;background:var(--teal);color:var(--navy);padding:10px 26px;border-radius:50px;font-weight:700;transition:background .3s,transform .3s}
.nav-cta:hover{background:var(--lteal);transform:translateY(-2px)}
.error-page{flex:1;display:flex;align-items:center;justify-content:center;padding:140px 40px 80px;background:linear-gradient(135deg,var(--navy) 0%,#0d2245 60%,#0e2a1e 100%);text-align:center}
.error-content{max-width:560px}
.error-code{font-size:clamp(5rem,12vw,8rem);font-weight:800;color:var(--teal);line-height:1;letter-spacing:-.05em;margin-bottom:16px;opacity:.85}
.error-title{font-size:clamp(1.4rem,3vw,2rem);font-weight:800;color:#fff;margin-bottom:16px;letter-spacing:-.03em}
.error-desc{font-size:1rem;color:rgba(255,255,255,.6);line-height:1.8;margin-bottom:36px}
.error-links{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.btn-teal{display:inline-block;background:var(--teal);color:var(--navy);text-decoration:none;font-weight:800;font-size:.82rem;letter-spacing:.1em;text-transform:uppercase;padding:14px 36px;border-radius:50px;transition:background .3s,transform .3s}
.btn-teal:hover{background:var(--lteal);transform:translateY(-2px)}
.btn-outline{display:inline-block;border:2px solid rgba(255,255,255,.2);color:rgba(255,255,255,.7);text-decoration:none;font-weight:600;font-size:.82rem;letter-spacing:.1em;text-transform:uppercase;padding:12px 32px;border-radius:50px;transition:border-color .3s,color .3s}
.btn-outline:hover{border-color:var(--teal);color:var(--teal)}
@media(max-width:768px){.nav{padding:14px 20px}.nav-links{display:none}.error-page{padding:120px 20px 60px}}
</style>
</head>
<body>
<nav class="nav">
  <a href="/" class="nav-logo">
    <img src="/img/beaudoins-hawaii-pool-cleaners-logo.png" alt="Hawaii Pool Cleaners">
    <div class="nav-logo-text">Hawaii Pool Cleaners<span>Island Pool Experts</span></div>
  </a>
  <ul class="nav-links">
    <li><a href="/">Home</a></li>
    <li><a href="/about/">About</a></li>
    <li><a href="/offerings/">Offerings</a></li>
    <li><a href="/areas/">Service Areas</a></li>
    <li><a href="/blog/">Blog</a></li>
    <li><a href="/contact/" class="nav-cta">Free Liner Quote</a></li>
  </ul>
</nav>
<main class="error-page">
  <div class="error-content">
    <div class="error-code">404</div>
    <h1 class="error-title">Page Not Found</h1>
    <p class="error-desc">The page you're looking for may have moved or no longer exists. Let us help you find what you need.</p>
    <div class="error-links">
      <a href="/" class="btn-teal">Back to Home</a>
      <a href="/contact/" class="btn-outline">Get a Free Quote</a>
      <a href="/offerings/" class="btn-outline">Our Services</a>
    </div>
  </div>
</main>
</body>
</html>
